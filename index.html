<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors Game</title>
        <link rel="stylesheet" href="./style.css">
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    </head>
    <body>
        <p class="title">Rock Paper Scissors Game!</p>

        <button onclick="
            playGame('rock');
        "class="move-button"><img src="./img/rock-emoji.png" class="move-icon"></button>

        <button onclick="
            playGame('paper');
        "class="move-button"><img src="./img/paper-emoji.png" class="move-icon"></button>

        <button onclick="
            playGame('scissors');
        "class="move-button"><img src="./img/scissors-emoji.png" class="move-icon"></button>

        <p class="js-moves moves"></p>
        <p class="js-result result"></p>
        <p class="js-score"></p>

        <button onclick="
            if (confirm('Are you sure?')) {
                score.wins = 0;
                score.losses = 0;
                score.ties = 0;
                localStorage.removeItem('score');
                updateScoreElement();
            }
        " class="reset-score-button">Reset Score</button>

        <button onclick="
            autoPlay();
        " class="auto-play-button">Auto Play</button>    
    
        <script src="./script.js"></script>
    </body>
</html>
