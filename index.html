<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors Game</title>
        <link rel="stylesheet" href="./style.css">
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    </head>
    <body>
        <p class="title">Rock Paper Scissors Game!</p>

        <button class="move-button js-rock-button"><img src="./img/rock-emoji.png" class="move-icon"></button>
        <button class="move-button js-paper-button"><img src="./img/paper-emoji.png" class="move-icon"></button>
        <button class="move-button js-scissors-button"><img src="./img/scissors-emoji.png" class="move-icon"></button>

        <p class="js-moves moves"></p>
        <p class="js-result result"></p>
        <p class="js-score"></p>

        <button class="reset-score-button js-reset-score-button">Reset Score</button>
        <button class="auto-play-button js-auto-play-button">Auto Play</button>    

        <script src="./script.js"></script>
    </body>
</html>
